const VL={en:"en-US",es:"es-MX",zh:"zh-CN",ja:"ja-JP",vi:"vi-VN",ko:"ko-KR"};
const canSpeak="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
let speaking=null,utts=[];
function stopSpeak(){speaking=null;utts=[];if(canSpeak)try{speechSynthesis.cancel()}catch(e){}}
function pickVoice(){
  const L=S.lang,full=VL[L].toLowerCase();let vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}
  vs=vs.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(L));if(!vs.length)return null;
  const score=v=>{const n=v.name.toLowerCase(),l=v.lang.replace("_","-").toLowerCase();let k=0;
    if(/natural|neural/.test(n))k+=50;if(/premium|enhanced|siri/.test(n))k+=40;if(/google/.test(n))k+=30;
    if(/compact|eloquence|espeak/.test(n))k-=30;
    if(l===full)k+=8;else if(L==="es"&&/es-(us|419|co|pe)/.test(l))k+=6;
    if(L==="zh"&&/(hk|tw|yue)/.test(l))k-=40;return k};
  const best=vs.slice().sort((a,b)=>score(b)-score(a))[0];
  return score(best)>=30?best:null;
}
function speak(id,text){
  if(!canSpeak)return;
  if(speaking===id){stopSpeak();render();return}
  const busy=speechSynthesis.speaking||speechSynthesis.pending;
  const parts=(text.match(/[^.!?。！？]+[.!?。！？]*/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const run=()=>{
    if(speaking!==id)return;
    try{speechSynthesis.resume()}catch(e){}
    const vc=pickVoice();
    utts=parts.map((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=vc?vc.lang:VL[S.lang];if(vc)u.voice=vc;u.rate=1;u.pitch=1;u.volume=1;
      if(i===parts.length-1)u.onend=()=>{if(speaking===id){speaking=null;utts=[];render()}};
      u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled"&&speaking===id){speaking=null;utts=[];render()}};
      return u});
    utts.forEach(u=>{try{speechSynthesis.speak(u)}catch(e){}});
  };
  speaking=id;
  if(busy){try{speechSynthesis.cancel()}catch(e){}setTimeout(run,120)}else run();
  render();
}
function listenBtn(id,getText){const w=el("div","listenwrap"),b=el("button","want listen",speaking===id?"■ "+t("stop"):"🔊 "+t("listen"));b.type="button";b.setAttribute("aria-pressed",String(speaking===id));b.onclick=()=>speak(id,getText());w.append(b);if(speaking===id)w.append(el("small","",t("noSound")));return w}
if(canSpeak)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
let S={screen:"home",lang:"en",name:"",from:"",country:"co",tab:"dishes",want:[],quiz:null,open:null,prev:"home",rec:false,swiped:false};
const ORDER=["home","register","lang","intro","choose"];
const BACK={register:"home",lang:"register",intro:"lang",choose:"intro",country:"choose",quiz:"choose"};
const $=id=>document.getElementById(id);
const t=(k,v)=>{let s=(T[k][S.lang]||T[k].en);if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
function save(){try{localStorage.setItem("cope",JSON.stringify({lang:S.lang,name:S.name,from:S.from,want:S.want}))}catch(e){}}
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem("cope")||"{}"))}catch(e){}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function conic(c){const n=c.length;return "conic-gradient("+c.map((x,i)=>x+" "+(i*360/n)+"deg "+((i+1)*360/n)+"deg").join(",")+")"}
function bands(c){const n=c.length;return "linear-gradient(160deg,"+c.map((x,i)=>x+" "+(i*100/n)+"% "+((i+1)*100/n)+"%").join(",")+")"}

function render(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("evt").textContent=t("evt");
  $("langbtn").textContent=S.lang.toUpperCase();
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id==="s-"+S.screen));
  $("back").hidden=!BACK[S.screen]&&S.screen!=="credits";
  const idx=ORDER.indexOf(S.screen);const step=idx<0?5:idx+1;
  [...$("steps").children].forEach((d,i)=>d.classList.toggle("on",i<step));
  // languages
  const L=$("langs");L.textContent="";
  LANGS.forEach(([c,n])=>{const b=el("button","opt");b.type="button";b.setAttribute("aria-pressed",String(c===S.lang));b.append(el("b","",n),el("span","",c.toUpperCase()));b.onclick=()=>{stopSpeak();S.lang=c;save();render()};L.append(b)});
  $("hello").textContent=S.name?t("hello",{n:S.name}):"";
  $("tally").textContent=S.want.length?t("tally",{n:S.want.length}):"";
  document.body.classList.toggle("home",S.screen==="home");
  const il=$("introlisten");il.textContent="";if(canSpeak)il.append(listenBtn("intro",()=>t("introTitle")+". "+t("intro1")+" "+t("intro2")));
  const wr=$("wantrow");wr.textContent="";S.want.forEach(n=>{if(PH[n])wr.append(pimg(n,"s"))});
  if(S.screen==="credits")renderCredits();
  renderSheet();
  if(S.screen==="country")renderCountry();
  if(S.screen==="quiz")renderQuiz();
}
function renderCountry(){
  const C=DATA[S.country];
  $("cflag").className="miniflag "+S.country;$("cname").textContent=CN[S.country];
  const F=$("facts");F.textContent="";
  [["capital",C.capital],["currency",C.currency]].forEach(([k,v])=>{const f=el("div","fact");f.append(el("small","",t(k)),document.createTextNode(v));F.append(f)});
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  const list=$("list");list.textContent="";
  C[S.tab].forEach((it,ix)=>{
    const b=el("button","tile"+(ix===0?" big":""));b.type="button";b.style.background=bands(it.c);
    b.append(pimg(it.n,ix===0?"l":"m"),el("b","",it.n));
    if(S.want.includes(it.n))b.append(el("span","heart","♥"));
    b.onclick=()=>{stopSpeak();S.rec=false;S.open=it.n;renderSheet()};list.append(b)});
}
function closeSheet(){S.open=null;S.rec=false;stopSpeak();renderSheet()}
const slug=n=>n.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function itemCountry(n){return DATA.co.dishes.concat(DATA.co.things).some(x=>x.n===n)?"co":"pe"}
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=el("div","toast",msg);d.setAttribute("role","status");document.body.append(d);setTimeout(()=>d.remove(),2600)}
async function shareItem(it){
  const url=location.origin+location.pathname+"#"+slug(it.n),text=t("shareText",{c:CN[itemCountry(it.n)],n:it.n});
  if(navigator.share){try{await navigator.share({title:it.n,text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(text+" "+url);toast(t("copied"))}catch(e){toast(url)}
}
function navDish(dir){
  const it=findItem(S.open);if(!it||!it.i)return;
  const L=DATA[itemCountry(it.n)].dishes,ix=L.findIndex(x=>x.n===it.n),nx=L[(ix+dir+L.length)%L.length];
  stopSpeak();S.rec=false;S.swiped=true;S.open=nx.n;
  const sh=$("sheet");sh.classList.remove("fromR","fromL");renderSheet();void sh.offsetWidth;sh.classList.add(dir>0?"fromR":"fromL");
}
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=rej;document.head.append(e)})}
async function corsImg(p){
  try{const j=await fetch("https://commons.wikimedia.org/w/api.php?origin=*&format=json&action=query&titles="+encodeURIComponent("File:"+p[0])+"&prop=imageinfo&iiprop=url&iiurlwidth=960").then(r=>r.json());
    const u=Object.values(j.query.pages)[0].imageinfo[0].thumburl;
    return await new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=u})}catch(e){return null}
}
function wrapText(x,text,maxW){
  const toks=text.split(/(\s+)/).flatMap(k=>x.measureText(k).width>maxW*0.5?[...k]:[k]);const lines=[];let line="";
  for(const k of toks){if(x.measureText(line+k).width>maxW&&line.trim()){lines.push(line.trim());line=k.trim()?k:""}else line+=k}
  if(line.trim())lines.push(line.trim());return lines;
}
async function recipePdf(it,btn){
  const rc=R[it.n];if(!rc)return;const old=btn.textContent;btn.disabled=true;btn.textContent=t("pdfBusy");
  try{
    if(!window.jspdf)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const img=await corsImg(PH[it.n]);
    const W=1240,M=90,F='-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK SC",sans-serif';
    const cv=document.createElement("canvas");cv.width=W;cv.height=3200;const x=cv.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,W,cv.height);x.textBaseline="top";let y=0;
    if(img){const ph=600,sc=Math.max(W/img.width,ph/img.height),sw=W/sc,shh=ph/sc;x.drawImage(img,(img.width-sw)/2,(img.height-shh)/2,sw,shh,0,0,W,ph);y=ph}
    y+=50;x.fillStyle="#6E6E73";x.font="600 26px "+F;x.fillText("Mission College · International Week · "+CN[itemCountry(it.n)],M,y);y+=48;
    x.fillStyle="#1D1D1F";x.font="800 76px "+F;wrapText(x,it.n,W-2*M).forEach(l=>{x.fillText(l,M,y);y+=88});y+=6;
    x.fillStyle="#6E6E73";x.font="500 30px "+F;x.fillText(rc.m,M,y);y+=58;
    x.fillStyle="#1D1D1F";x.font="400 32px "+F;wrapText(x,it.d[S.lang]||it.d.en,W-2*M).forEach(l=>{x.fillText(l,M,y);y+=46});y+=20;
    x.fillStyle="#6E6E73";x.font="400 28px "+F;wrapText(x,it.i,W-2*M).forEach(l=>{x.fillText(l,M,y);y+=40});y+=34;
    x.fillStyle="#1D1D1F";x.font="700 44px "+F;x.fillText(t("recipeT"),M,y);y+=70;
    (rc.s[S.lang]||rc.s.en).forEach((st,i)=>{x.font="700 32px "+F;x.fillStyle="#0071E3";x.fillText(String(i+1),M,y);x.fillStyle="#1D1D1F";x.font="400 32px "+F;
      wrapText(x,st,W-2*M-60).forEach(l=>{x.fillText(l,M+60,y);y+=46});y+=22});
    y+=24;x.fillStyle="#98989D";x.font="400 22px "+F;
    wrapText(x,t("photo")+": "+PH[it.n][1]+" · "+PH[it.n][2]+" · Wikimedia Commons    "+location.origin+location.pathname,W-2*M).forEach(l=>{x.fillText(l,M,y);y+=32});
    const H=Math.max(1754,y+70),out=document.createElement("canvas");out.width=W;out.height=H;const o=out.getContext("2d");o.fillStyle="#fff";o.fillRect(0,0,W,H);o.drawImage(cv,0,0);
    const doc=new window.jspdf.jsPDF({unit:"px",format:[W,H],orientation:"portrait",hotfixes:["px_scaling"]});
    doc.addImage(out.toDataURL("image/jpeg",.9),"JPEG",0,0,W,H);doc.save(slug(it.n)+"-"+S.lang+".pdf");
  }catch(e){toast(t("pdfFail"))}
  btn.disabled=false;btn.textContent=old;
}
function renderSheet(){
  const bg=$("sheetbg");if(!S.open||!findItem(S.open)){bg.hidden=true;return}
  const it=findItem(S.open),sh=$("sheet");bg.hidden=false;
  const same=sh.dataset.n===it.n,og=sh.querySelector(".gal"),keep=same?sh.scrollTop:0,keepX=same&&og?og.scrollLeft:0;
  const ph=el("div","sheetph"),gal=el("div","gal"),pics=[PH[it.n]].concat(G[it.n]||[]);
  pics.forEach((p,ix)=>{const f=el("figure");f.style.background=bands(it.c);const i=fimg(p,"l",it.n);if(ix>0)i.loading="lazy";f.append(i,el("figcaption","",p[1]+" · "+p[2]));gal.append(f)});
  ph.append(gal);
  const pv=el("button","iconbtn galnav prev","‹"),nx=el("button","iconbtn galnav next","›");pv.type=nx.type="button";
  if(pics.length>1){
    const ct=el("span","galct","1 / "+pics.length);gal.onscroll=()=>{ct.textContent=(Math.round(gal.scrollLeft/gal.clientWidth)+1)+" / "+pics.length};
    const mv=d=>()=>gal.scrollBy({left:d*gal.clientWidth,behavior:"smooth"});
    pv.setAttribute("aria-label","Previous photo");nx.setAttribute("aria-label","Next photo");pv.onclick=mv(-1);nx.onclick=mv(1);
    ph.append(ct,pv,nx);
  }else if(it.i){
    const L=DATA[itemCountry(it.n)].dishes;
    pv.setAttribute("aria-label","Previous dish");nx.setAttribute("aria-label","Next dish");pv.onclick=()=>navDish(-1);nx.onclick=()=>navDish(1);
    ph.append(el("span","galct",(L.findIndex(v=>v.n===it.n)+1)+" / "+L.length),pv,nx);
  }
  const x=el("button","iconbtn sheetx","×");x.type="button";x.setAttribute("aria-label","Close");x.onclick=closeSheet;ph.append(x);
  const body=el("div","sheetbody");body.append(el("h2","",it.n));
  body.append(el("p","muted",t(it.i?"swipeDish":"swipe")));
  body.append(el("p","",it.d[S.lang]||it.d.en));
  const rc=R[it.n],steps=rc&&(rc.s[S.lang]||rc.s.en);
  const acts=el("div","row");
  if(canSpeak)acts.append(listenBtn("sheet:"+it.n,()=>it.n+". "+(it.d[S.lang]||it.d.en)+(S.rec&&steps?" "+t("recipeT")+". "+steps.join(" "):"")));
  if(it.i){const sb=el("button","want","↗ "+t("share"));sb.type="button";sb.onclick=()=>shareItem(it);acts.append(sb)}
  if(acts.childElementCount)body.append(acts);
  if(it.i){const ch=el("div","chips");it.i.split(" · ").forEach(v=>ch.append(el("span","chip",v)));body.append(ch);
    if(rc){
      const pb=el("button","btn ghost","⬇ "+t("pdf"));pb.type="button";pb.onclick=()=>recipePdf(it,pb);
      if(S.rec){const bx=el("div","recipe");bx.append(el("h3","",t("recipeT")),el("small","",rc.m));const ol=el("ol");steps.forEach(v=>ol.append(el("li","",v)));bx.append(ol,pb);body.append(bx)}
      else{const rb=el("button","btn",t("recipe"));rb.type="button";rb.onclick=()=>{S.rec=true;renderSheet()};const rr=el("div","row");rr.append(rb,pb);body.append(rr)}
    }
    const on=S.want.includes(it.n);const w=el("button","want",on?t("wanted"):t("want"));w.type="button";w.setAttribute("aria-pressed",String(on));
    w.onclick=()=>{S.want=on?S.want.filter(v=>v!==it.n):[...S.want,it.n];save();render()};body.append(w);
    if(S.swiped){const q=el("button","btn takequiz",t("takeQuiz")+" →");q.type="button";q.onclick=()=>go("quiz");body.append(q)}
  }
  sh.dataset.n=it.n;sh.textContent="";sh.append(ph,body);sh.scrollTop=keep;gal.scrollLeft=keepX;
}
function renderCredits(){
  const L=$("creditlist");if(L.childElementCount)return;
  Object.keys(PH).forEach(n=>{const a=el("a","credit");a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(PH[n][0].replace(/ /g,"_"));a.target="_blank";a.rel="noopener";
    const d=el("div");d.append(el("b","",n),document.createTextNode(PH[n][1]+" · "+PH[n][2]));a.append(pimg(n,"s"),d);L.append(a)});
  Object.keys(G).forEach(n=>G[n].forEach((p,ix)=>{const a=el("a","credit");a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(p[0].replace(/ /g,"_"));a.target="_blank";a.rel="noopener";
    const d=el("div");d.append(el("b","",n+" "+(ix+2)),document.createTextNode(p[1]+" · "+p[2]));const i=fimg(p,"s",n);i.loading="lazy";a.append(i,d);L.append(a)}));
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("confetti");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const col=["#FFCD00","#003087","#C8102E","#D91023","#FFFFFF"];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,w:6+Math.random()*6,r:Math.random()*6,c:col[Math.floor(Math.random()*col.length)],s:(Math.random()-.5)*2}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});
    if(now-t0<3200)requestAnimationFrame(f);else c.hidden=true})(t0);
}
const QN=10;
function newQuiz(){
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const d=[],p=[];
  for(const c of["co","pe"]){DATA[c].dishes.forEach(x=>d.push({c,n:x.n}));DATA[c].things.forEach(x=>{if(x.n!=="Aves"&&x.n!=="Amazonía")p.push({c,n:x.n})})}
  S.quiz={q:sh(sh(d).slice(0,5).concat(sh(p).slice(0,5))),i:0,ans:null,wrong:null};
}
function renderQuiz(){
  if(!S.quiz||!S.quiz.q||S.quiz.q.length!==QN)newQuiz();
  const Q=S.quiz,box=$("quizcard");box.textContent="";
  $("rules").textContent=t("rules",{t:QN});
  if(Q.i>=QN){
    if(!Q.done){Q.done=1;Q.at=new Date().toLocaleString(S.lang,{dateStyle:"medium",timeStyle:"short"});confetti()}
    const pz=el("div","prize"),inn=el("div","in");pz.setAttribute("role","status");
    inn.append(el("small","",t("win")+(S.name?" "+S.name:"")),el("strong","",t("claim")),el("span","",t("claimHint")),el("em","",QN+" / "+QN+" · "+Q.at));
    pz.append(el("div","stripe"),inn);box.append(pz);
    const again=el("button","btn",t("again"));again.onclick=()=>{newQuiz();render()};
    const home=el("button","btn ghost",t("choose"));home.onclick=()=>go("choose");
    const r=el("div","row");r.append(again,home);box.append(r);return}
  const cur=Q.q[Q.i],d=findItem(cur.n);
  box.append(el("p","muted",(Q.i+1)+" / "+QN));
  const p=el("div","qph");p.style.background=bands(d.c);p.append(pimg(d.n,"l"));box.append(p,el("h3","",d.n));
  if(d.i){const chips=el("div","chips");chips.style.justifyContent="center";d.i.split(" · ").forEach(x=>chips.append(el("span","chip",x)));box.append(chips)}
  const fb=el("div","fb");fb.setAttribute("role","status");
  if(Q.ans==="ok"){
    fb.className="fb ok";fb.textContent=t("ok");
    const nx=el("button","btn",t("next"));nx.onclick=()=>{Q.i++;Q.ans=null;Q.wrong=null;render();window.scrollTo(0,0)};
    box.append(fb,el("p","muted",d.d[S.lang]||d.d.en),nx);
  }else{
    const r=el("div","row");
    ["pe","co"].forEach(c=>{const b=el("button","btn ghost",CN[c]);b.disabled=Q.wrong===c;b.onclick=()=>{if(c===cur.c){Q.ans="ok"}else{Q.ans="retry";Q.wrong=c}render()};r.append(b)});
    if(Q.ans==="retry"){fb.className="fb no";fb.textContent=t("retry")}
    box.append(r,fb);
  }
}
function go(s){stopSpeak();S.rec=false;if(s==="credits"&&S.screen!=="credits")S.prev=S.screen;S.open=null;S.screen=s;if(s==="quiz"&&(!S.quiz||S.quiz.i>=S.quiz.q.length))newQuiz();render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const c=e.target.closest("[data-country]");if(c){S.country=c.dataset.country;S.tab="dishes";go("country");return}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render()}
});
$("back").onclick=()=>go(S.screen==="credits"?(S.prev||"home"):(BACK[S.screen]||"home"));
$("sheetbg").onclick=e=>{if(e.target.id==="sheetbg")closeSheet()};
(function(){const sh=$("sheet");let sx=0,sy=0,on=false;
  sh.addEventListener("touchstart",e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;on=e.touches.length===1},{passive:true});
  sh.addEventListener("touchend",e=>{if(!on)return;on=false;const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)navDish(dx<0?1:-1)},{passive:true});
  document.addEventListener("keydown",e=>{if(!S.open)return;if(e.key==="ArrowRight")navDish(1);if(e.key==="ArrowLeft")navDish(-1)});
})();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.open)closeSheet()});
(function(){const st=$("strip"),names=[...DATA.co.dishes,...DATA.pe.dishes].map((d,i,a)=>a[(i%2?0:a.length/2)+Math.floor(i/2)].n);
  [...names,...names].forEach(n=>{const i=pimg(n,"s");i.loading="eager";st.append(i)});
  (function(){const i=new Image();i.onload=()=>{$("campus").style.backgroundImage='url("'+i.src+'")'};i.src=purl("Mission College","l")})();
  document.querySelectorAll("img[data-ph]").forEach(i=>{i.onerror=()=>i.remove();i.src=purl(i.dataset.ph,"l")})})();
$("langbtn").onclick=()=>{stopSpeak();const i=LANGS.findIndex(l=>l[0]===S.lang);S.lang=LANGS[(i+1)%LANGS.length][0];save();render()};
$("regform").addEventListener("submit",e=>{e.preventDefault();const n=$("name").value.trim();
  if(!n){$("regerr").textContent=t("needName");$("name").focus();return}
  $("regerr").textContent="";S.name=n;S.from=$("from").value.trim();save();go("lang")});

function start(d){load();if(d&&d.screen)Object.assign(S,d);
  const h=(location.hash||"").slice(1);if(h){const hit=Object.keys(PH).find(n=>slug(n)===h&&findItem(n));if(hit){const it=findItem(hit);S.country=itemCountry(hit);S.tab=it.i?"dishes":"things";S.screen="country";S.open=hit}}$("name").value=S.name||"";$("from").value=S.from||"";render()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
