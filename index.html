<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colombia & Perú en la Semana Internacional</title>
<style>
/* Layout idea: one phone-width column, one screen per step, flags as the only loud color. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --line:#D2D2D7;
  --accent:#0071E3; --on-accent:#FFFFFF; --good:#248A3D; --bad:#D70015;
  --co-y:#FFCD00; --co-b:#003087; --co-r:#C8102E; --pe-r:#D91023; --pe-w:#FFFFFF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
  --r:18px;
  --veil:rgba(245,245,247,.80); --veil-home:rgba(245,245,247,.62);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --muted:#98989D; --line:#38383A;
    --accent:#2997FF; --on-accent:#FFFFFF; --good:#30D158; --bad:#FF453A; --veil:rgba(0,0,0,.76); --veil-home:rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --muted:#98989D; --line:#38383A;
  --accent:#2997FF; --on-accent:#FFFFFF; --good:#30D158; --bad:#FF453A; --veil:rgba(0,0,0,.76); --veil-home:rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:12px 20px 48px;display:flex;flex-direction:column;gap:20px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar .brand{flex:1;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);line-height:1.25}
.bar .brand b{display:block;color:var(--ink);font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 12px;font-size:14px;font-weight:600}
.iconbtn[hidden]{display:none}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--ink)}

/* screens */
.screen{display:none;flex-direction:column;gap:20px}
.screen.active{display:flex;animation:in .35s ease both}
@keyframes in{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.screen.active{animation:none}.flag{animation:none!important}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(40px,12vw,56px);line-height:1.02;font-weight:800}
h2{font-size:30px;line-height:1.1;font-weight:700}
h3{font-size:19px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:19px;color:var(--muted)}
.muted{color:var(--muted);font-size:15px}

.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:14px 26px;font-size:17px;font-weight:600;align-self:flex-start}
.btn.wide{align-self:stretch}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}

/* flags */
.flags{position:relative;aspect-ratio:100/50}
.flag{position:absolute;width:58%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18);border:1px solid var(--line)}
.flag.co{left:0;top:0;transform:rotate(-5deg);background:linear-gradient(var(--co-y) 0 50%,var(--co-b) 50% 75%,var(--co-r) 75%);animation:sway 6s ease-in-out infinite alternate}
.flag.pe{right:0;top:22px;transform:rotate(6deg);background:linear-gradient(90deg,var(--pe-r) 0 33.3%,var(--pe-w) 33.3% 66.6%,var(--pe-r) 66.6%);animation:sway2 6s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(-2deg) translateY(-4px)}}
@keyframes sway2{to{transform:rotate(3deg) translateY(4px)}}
.miniflag{width:44px;aspect-ratio:3/2;border-radius:6px;border:1px solid var(--line);flex:none}
.miniflag.co{background:linear-gradient(var(--co-y) 0 50%,var(--co-b) 50% 75%,var(--co-r) 75%)}
.miniflag.pe{background:linear-gradient(90deg,var(--pe-r) 0 33.3%,var(--pe-w) 33.3% 66.6%,var(--pe-r) 66.6%)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.err{color:var(--bad);font-size:14px;min-height:20px}

/* lists */
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:19px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.country{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:left;display:flex;gap:16px;align-items:center}
.country div{display:flex;flex-direction:column;gap:4px}
.country b{font-family:var(--display);font-size:26px;letter-spacing:-.02em}
.country span{font-size:15px;color:var(--muted)}
.country .miniflag{width:64px}

.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.fact small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:15px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start}
.card .body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.card p{font-size:15px;color:var(--muted)}
.plate{flex:none;width:72px;height:72px;border-radius:50%;background:#FBFBFD;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.plate i{width:50px;height:50px;border-radius:50%;display:block}
.post{flex:none;width:72px;height:72px;border-radius:14px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.want{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--accent)}
.want[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tally{font-size:14px;color:var(--muted)}

.quizcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.quizcard .plate{width:110px;height:110px}.quizcard .plate i{width:78px;height:78px}
.fb{min-height:24px;font-weight:600}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
footer{margin-top:auto;font-size:12px;color:var(--muted);text-align:center;padding-top:12px}

[hidden]{display:none!important}
.strip{overflow:hidden;margin:0 -20px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.strip-in{display:flex;gap:12px;width:max-content;animation:slide 48s linear infinite}
.strip-in img{width:120px;height:120px;object-fit:cover;border-radius:18px;background:var(--line)}
@keyframes slide{to{transform:translateX(-50%)}}
.country{position:relative;aspect-ratio:16/9;overflow:hidden;padding:0;align-items:flex-end;color:#fff;background:#3a3a3c;width:100%}
.country>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.country:active>img{transform:scale(1.04)}
.country::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.72))}
.country>div{position:relative;z-index:1;padding:16px;flex-direction:row!important;align-items:center;gap:12px!important}
.country>div>div{display:flex;flex-direction:column;gap:2px}
.country span{color:rgba(255,255,255,.88)}
.country .miniflag{width:48px;border-color:rgba(255,255,255,.6)}
.wantrow{display:flex;gap:8px;flex-wrap:wrap}
.wantrow img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;aspect-ratio:4/5;color:#fff;text-align:left;display:block}
.tile.big{grid-column:1/-1;aspect-ratio:16/10}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tile:active img{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.75))}
.tile b{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;font-family:var(--display);font-size:18px;line-height:1.15;letter-spacing:-.01em}
.tile.big b{font-size:24px}
.tile .heart{position:absolute;top:10px;right:10px;z-index:1;background:var(--accent);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40%)}}
.sheetph{position:relative;aspect-ratio:4/3}
.sheetph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheetx{position:absolute;top:12px;right:12px;font-size:20px;line-height:1}
.sheetbody{padding:20px 20px 32px;display:flex;flex-direction:column;gap:12px}
.qph{width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;position:relative}
.qph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.credit{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.credit img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.credit div{min-width:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.credit b{display:block;color:var(--ink);font-size:15px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:8px;text-decoration:underline}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.strip-in,.sheet,.sheetbg{animation:none}}
.prize{align-self:stretch;background:var(--ink);color:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;animation:pulse 1.4s ease-in-out infinite alternate}
.prize .stripe{height:10px;background:linear-gradient(90deg,var(--co-y) 0 25%,var(--co-b) 25% 37.5%,var(--co-r) 37.5% 50%,var(--pe-r) 50% 66.6%,var(--pe-w) 66.6% 83.3%,var(--pe-r) 83.3%)}
.prize .in{padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.prize small{font-size:15px;font-weight:600;opacity:.8}
.prize strong{font-family:var(--display);font-size:clamp(30px,9vw,40px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.prize span{font-size:15px;opacity:.85}
.prize em{font-style:normal;font-size:13px;opacity:.7;font-variant-numeric:tabular-nums}
@keyframes pulse{to{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.prize{animation:none}}
.campus{position:fixed;inset:0;z-index:-1;background:var(--bg) center/cover no-repeat}
.campus::after{content:"";position:absolute;inset:0;background:var(--veil);transition:background .4s}
body.home .campus::after{background:var(--veil-home)}
body.home .lead{color:var(--ink)}
.app{position:relative}
.listen{display:inline-flex;gap:6px;align-items:center}
.recipe{background:var(--bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.recipe ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.recipe small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="campus" id="campus" aria-hidden="true"></div>
<div class="app">
  <div class="bar">
    <button class="iconbtn" id="back" hidden aria-label="Back">‹</button>
    <div class="brand"><b>Mission College</b><span id="evt">International Week</span></div>
    <button class="iconbtn" id="langbtn" aria-label="Language">EN</button>
  </div>
  <div class="steps" id="steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <section class="screen active" id="s-home">
    <div class="flags" aria-hidden="true"><div class="flag co"></div><div class="flag pe"></div></div>
    <h1>Colombia <span style="color:var(--muted)">&amp;</span> Perú</h1>
    <p class="lead" data-t="heroSub"></p>
    <button class="btn" data-go="register" data-t="start"></button>
    <div class="strip" aria-hidden="true"><div class="strip-in" id="strip"></div></div>
  </section>

  <section class="screen" id="s-register">
    <h2 data-t="regTitle"></h2>
    <form id="regform" class="grid" novalidate>
      <div class="field"><label for="name" data-t="nameLb"></label><input id="name" autocomplete="given-name" maxlength="40"></div>
      <div class="field"><label for="from" data-t="fromLb"></label><input id="from" autocomplete="country-name" maxlength="40"></div>
      <div class="err" id="regerr" role="alert"></div>
      <button class="btn wide" type="submit" data-t="cont"></button>
      <p class="muted" data-t="regHint"></p>
    </form>
  </section>

  <section class="screen" id="s-lang">
    <h2 data-t="langTitle"></h2>
    <div class="grid two" id="langs"></div>
    <button class="btn wide" data-go="intro" data-t="cont"></button>
  </section>

  <section class="screen" id="s-intro">
    <p class="muted" id="hello"></p>
    <h2 data-t="introTitle"></h2>
    <p data-t="intro1"></p>
    <p data-t="intro2"></p>
    <div id="introlisten"></div>
    <button class="btn wide" data-go="choose" data-t="choose"></button>
  </section>

  <section class="screen" id="s-choose">
    <h2 data-t="choose"></h2>
    <button class="country" data-country="co"><img alt="" data-ph="Valle de Cocora"><div><i class="miniflag co"></i><div><b>Colombia</b><span data-t="coTag"></span></div></div></button>
    <button class="country" data-country="pe"><img alt="" data-ph="Machu Picchu"><div><i class="miniflag pe"></i><div><b>Perú</b><span data-t="peTag"></span></div></div></button>
    <p class="tally" id="tally"></p>
    <div class="wantrow" id="wantrow"></div>
    <button class="btn wide" data-go="quiz" data-t="quiz"></button>
  </section>

  <section class="screen" id="s-country">
    <div style="display:flex;gap:14px;align-items:center"><i class="miniflag" id="cflag"></i><h2 id="cname"></h2></div>
    <div class="facts" id="facts"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-dishes" data-tab="dishes" data-t="dishes"></button>
      <button role="tab" id="tab-things" data-tab="things" data-t="things"></button>
    </div>
    <p class="muted" data-t="tapHint"></p>
    <div class="tiles" id="list"></div>
    <button class="btn wide" data-go="quiz" data-t="quiz"></button>
  </section>

  <section class="screen" id="s-quiz">
    <h2 data-t="quizQ"></h2>
    <p class="muted" id="rules"></p>
    <div class="quizcard" id="quizcard"></div>
  </section>

  <section class="screen" id="s-credits">
    <h2 data-t="credits"></h2>
    <p class="muted" data-t="creditsNote"></p>
    <div class="grid" id="creditlist"></div>
  </section>

  <footer>Mission College · International Week · Colombia &amp; Perú<br><button class="linkbtn" data-go="credits" data-t="credits"></button></footer>
</div>
<div class="sheetbg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
const LANGS=[["en","English"],["es","Español"],["zh","中文"],["ja","日本語"],["vi","Tiếng Việt"],["ko","한국어"]];
const T={
evt:{en:"International Week",es:"Semana Internacional",zh:"国际周",ja:"インターナショナルウィーク",vi:"Tuần lễ Quốc tế",ko:"국제 주간"},
heroSub:{en:"Two countries, one table. Explore their landscapes and the dishes people love.",es:"Dos países, una sola mesa. Descubre sus paisajes y los platos que más queremos.",zh:"两个国家，一张餐桌。探索它们的风景和人们喜爱的美食。",ja:"ふたつの国、ひとつの食卓。美しい風景と愛される料理を見てみましょう。",vi:"Hai đất nước, một bàn ăn. Khám phá cảnh đẹp và những món ăn được yêu thích.",ko:"두 나라, 하나의 식탁. 아름다운 풍경과 사랑받는 음식을 만나 보세요."},
start:{en:"Start",es:"Empezar",zh:"开始",ja:"はじめる",vi:"Bắt đầu",ko:"시작하기"},
regTitle:{en:"First, tell us who you are",es:"Primero, cuéntanos quién eres",zh:"先告诉我们你是谁",ja:"まず、あなたのことを教えてください",vi:"Trước tiên, hãy cho chúng tôi biết bạn là ai",ko:"먼저, 자신을 소개해 주세요"},
nameLb:{en:"Your name",es:"Tu nombre",zh:"你的名字",ja:"お名前",vi:"Tên của bạn",ko:"이름"},
fromLb:{en:"Where are you from? (optional)",es:"¿De dónde eres? (opcional)",zh:"你来自哪里？（选填）",ja:"ご出身は？（任意）",vi:"Bạn đến từ đâu? (không bắt buộc)",ko:"어디에서 오셨나요? (선택)"},
regHint:{en:"Your name stays on this phone. We only use it to greet you.",es:"Tu nombre se queda en este teléfono. Solo lo usamos para saludarte.",zh:"你的名字只保存在这部手机上，仅用于向你问好。",ja:"お名前はこの端末にのみ保存され、ごあいさつにだけ使います。",vi:"Tên của bạn chỉ lưu trên điện thoại này và chỉ dùng để chào bạn.",ko:"이름은 이 휴대폰에만 저장되며 인사할 때만 사용합니다."},
needName:{en:"Please type your name to continue.",es:"Escribe tu nombre para continuar.",zh:"请输入你的名字再继续。",ja:"続けるにはお名前を入力してください。",vi:"Hãy nhập tên của bạn để tiếp tục.",ko:"계속하려면 이름을 입력해 주세요."},
cont:{en:"Continue",es:"Continuar",zh:"继续",ja:"次へ",vi:"Tiếp tục",ko:"계속"},
langTitle:{en:"Choose your language",es:"Elige tu idioma",zh:"选择语言",ja:"言語を選んでください",vi:"Chọn ngôn ngữ",ko:"언어를 선택하세요"},

introTitle:{en:"Neighbors in South America",es:"Vecinos en Suramérica",zh:"南美洲的两位邻居",ja:"南米のおとなりどうし",vi:"Hai người hàng xóm ở Nam Mỹ",ko:"남아메리카의 이웃 나라"},
intro1:{en:"Colombia and Peru share a border in the Amazon, the Andes mountains, the Spanish language and a deep love of food and music.",es:"Colombia y Perú comparten frontera en la Amazonía, la cordillera de los Andes, el idioma español y un amor profundo por la comida y la música.",zh:"哥伦比亚和秘鲁在亚马孙地区接壤，同享安第斯山脉和西班牙语，也同样热爱美食与音乐。",ja:"コロンビアとペルーはアマゾンで国境を接し、アンデス山脈とスペイン語、そして食と音楽への深い愛を分かち合っています。",vi:"Colombia và Peru có chung đường biên giới ở Amazon, chung dãy Andes, tiếng Tây Ban Nha và tình yêu sâu đậm với ẩm thực và âm nhạc.",ko:"콜롬비아와 페루는 아마존에서 국경을 맞대고 있으며, 안데스산맥과 스페인어, 그리고 음식과 음악에 대한 깊은 사랑을 함께 나눕니다."},
intro2:{en:"From Caribbean beaches to Inca cities in the clouds, each country cooks with what its land gives: corn, potatoes, plantain, fresh fish and chili peppers.",es:"De las playas del Caribe a las ciudades incas entre las nubes, cada país cocina con lo que da su tierra: maíz, papa, plátano, pescado fresco y ají.",zh:"从加勒比海滩到云端的印加古城，两国都用土地的馈赠做菜：玉米、土豆、大蕉、鲜鱼和辣椒。",ja:"カリブ海のビーチから雲の上のインカの都まで。どちらの国も、とうもろこし、じゃがいも、プランテン、新鮮な魚、唐辛子など大地の恵みで料理します。",vi:"Từ bãi biển Caribe đến thành phố Inca giữa mây trời, mỗi nước nấu ăn bằng sản vật quê hương: ngô, khoai tây, chuối nấu, cá tươi và ớt.",ko:"카리브해 해변에서 구름 위의 잉카 도시까지, 두 나라는 옥수수, 감자, 플랜틴, 신선한 생선, 고추 등 땅이 주는 재료로 요리합니다."},

{n:"Bandeja paisa",c:["#7B3F1D","#F4F1E8","#E9A23B","#F7D154","#6FA34A"],i:"frijoles · arroz · chicharrón · huevo · aguacate",d:{en:"A huge platter from Antioquia: beans, rice, ground beef, crispy pork belly, fried egg, sweet plantain, avocado and an arepa.",es:"Un plato enorme de Antioquia: frijoles, arroz, carne molida, chicharrón, huevo frito, plátano maduro, aguacate y arepa.",zh:"来自安蒂奥基亚的超大拼盘：豆子、米饭、牛肉末、脆皮五花肉、煎蛋、甜大蕉、牛油果和玉米饼。",ja:"アンティオキア地方の大皿料理。豆、ごはん、ひき肉、カリカリの豚バラ、目玉焼き、甘いプランテン、アボカド、アレパがのります。",vi:"Đĩa lớn từ vùng Antioquia: đậu, cơm, thịt bò xay, ba chỉ giòn, trứng ốp la, chuối chín, bơ và bánh arepa.",ko:"안티오키아 지방의 푸짐한 한 접시: 콩, 밥, 다진 소고기, 바삭한 삼겹살 튀김, 달걀 프라이, 단 플랜틴, 아보카도, 아레파."}},
{n:"Ajiaco",c:["#F0DC8C","#F7D154","#FBF6E4","#6FA34A"],i:"pollo · tres papas · mazorca · guascas",d:{en:"Bogotá's chicken soup, made with three kinds of potato, corn on the cob and an herb called guascas.",es:"La sopa de pollo de Bogotá, con tres tipos de papa, mazorca y una hierba llamada guascas.",zh:"波哥大的鸡汤，用三种土豆、玉米棒和一种叫 guascas 的香草熬成。",ja:"ボゴタのチキンスープ。3種類のじゃがいも、とうもろこし、グアスカスというハーブで作ります。",vi:"Súp gà của Bogotá, nấu với ba loại khoai tây, ngô và một loại rau thơm tên guascas.",ko:"보고타의 닭고기 수프. 세 가지 감자와 옥수수, 구아스카스라는 허브로 끓입니다."}},
{n:"Arepa",c:["#F6E7B4","#EBD08A","#FFFDF5"],i:"maíz · queso · mantequilla",d:{en:"A round corn cake cooked on the grill. Colombians eat it every day, plain, with cheese or stuffed.",es:"Una torta redonda de maíz hecha a la parrilla. En Colombia se come todos los días: sola, con queso o rellena.",zh:"烤制的圆形玉米饼。哥伦比亚人天天吃，可以原味、加奶酪或夹馅。",ja:"鉄板で焼く丸いとうもろこしのパン。そのまま、チーズをのせて、具をはさんで、毎日食べます。",vi:"Bánh ngô tròn nướng. Người Colombia ăn hằng ngày: ăn không, với phô mai hoặc kẹp nhân.",ko:"그릴에 구운 둥근 옥수수 빵. 콜롬비아 사람들은 그냥, 치즈를 올려, 또는 속을 채워 매일 먹습니다."}},
{n:"Sancocho",c:["#D9A441","#F7D154","#F1E3C0","#6FA34A","#C97B3A"],i:"carne · plátano · yuca · mazorca",d:{en:"A hearty stew of meat, plantain, cassava and corn. It is the dish for Sunday with the whole family.",es:"Un caldo sustancioso de carne, plátano, yuca y mazorca. Es el plato del domingo con toda la familia.",zh:"用肉、大蕉、木薯和玉米炖成的浓汤，是周日全家团聚时的菜。",ja:"肉、プランテン、キャッサバ、とうもろこしの具だくさんスープ。日曜日に家族みんなで食べます。",vi:"Món hầm đậm đà gồm thịt, chuối nấu, sắn và ngô. Đây là món Chủ nhật của cả gia đình.",ko:"고기, 플랜틴, 카사바, 옥수수를 넣은 든든한 스튜. 일요일에 온 가족이 함께 먹습니다."}},
{n:"Empanadas",c:["#E2A33A","#C97B3A","#F3C766"],i:"masa de maíz · carne · papa · ají",d:{en:"Crispy fried corn turnovers filled with meat and potato, eaten with a spicy sauce called ají.",es:"Crujientes, fritas y de masa de maíz, rellenas de carne y papa. Se comen con ají.",zh:"酥脆的炸玉米馅饼，里面是肉和土豆，蘸辣酱 ají 吃。",ja:"とうもろこし生地で肉とじゃがいもを包んで揚げたもの。アヒという辛いソースで食べます。",vi:"Bánh ngô chiên giòn nhân thịt và khoai tây, ăn kèm sốt cay ají.",ko:"옥수수 반죽에 고기와 감자를 넣어 바삭하게 튀긴 만두. 매콤한 아히 소스와 함께 먹습니다."}},
{n:"Buñuelos",c:["#D9963A","#E9B45C","#C97B3A"],i:"queso costeño · almidón de yuca",d:{en:"Golden fried balls of cheese dough, crisp outside and soft inside. A Christmas favorite.",es:"Bolitas doradas de masa con queso, crocantes por fuera y suaves por dentro. Infaltables en Navidad.",zh:"金黄的炸奶酪面团球，外脆内软，是圣诞节的最爱。",ja:"チーズ入り生地の揚げボール。外はカリッと中はふんわり。クリスマスの定番です。",vi:"Viên bột phô mai chiên vàng, ngoài giòn trong mềm. Món được yêu thích dịp Giáng sinh.",ko:"치즈 반죽을 동그랗게 튀긴 간식. 겉은 바삭하고 속은 부드러우며 크리스마스에 꼭 먹습니다."}}

{n:"Caño Cristales",c:["#D91A5B","#F7D154","#2FA36B","#1E6FD9"],d:{en:"A river that turns red, yellow, green and blue for a few months each year. People call it the river of five colors.",es:"Un río que se pinta de rojo, amarillo, verde y azul unos meses al año. Lo llaman el río de los cinco colores.",zh:"每年有几个月会变成红、黄、绿、蓝色的河流，被称为“五彩河”。",ja:"毎年数か月だけ赤、黄、緑、青に染まる川。「五色の川」と呼ばれています。",vi:"Dòng sông chuyển màu đỏ, vàng, xanh lá và xanh dương vài tháng mỗi năm, được gọi là sông năm màu.",ko:"해마다 몇 달 동안 빨강, 노랑, 초록, 파랑으로 물드는 강. '다섯 빛깔의 강'이라 불립니다."}},
{n:"Valle de Cocora",c:["#BFE3F5","#7DBA6A","#3E8A4B"],d:{en:"A green valley with wax palms, the tallest palm trees in the world and Colombia's national tree.",es:"Un valle verde con palmas de cera, las palmas más altas del mundo y el árbol nacional de Colombia.",zh:"长满蜡棕榈的绿色山谷。蜡棕榈是世界上最高的棕榈树，也是哥伦比亚的国树。",ja:"緑の谷に立つロウヤシは世界一背の高いヤシで、コロンビアの国の木です。",vi:"Thung lũng xanh với cọ sáp, loài cọ cao nhất thế giới và là quốc thụ của Colombia.",ko:"세계에서 가장 키가 큰 야자수이자 콜롬비아의 국목인 왁스야자가 자라는 푸른 계곡."}},
{n:"Cartagena",c:["#F4B63F","#EE6C4D","#3BA7C9"],d:{en:"A walled city on the Caribbean with colorful colonial houses and balconies full of flowers.",es:"Una ciudad amurallada frente al Caribe, con casas coloniales de colores y balcones llenos de flores.",zh:"加勒比海边的古城墙之城，有五彩的殖民时期房屋和开满鲜花的阳台。",ja:"カリブ海に面した城壁の街。カラフルなコロニアル様式の家と花いっぱいのバルコニーが並びます。",vi:"Thành phố có tường thành bên biển Caribe, với những ngôi nhà thuộc địa rực rỡ và ban công đầy hoa.",ko:"카리브해에 면한 성곽 도시. 알록달록한 식민지 시대 집과 꽃이 가득한 발코니가 있습니다."}},
{n:"Eje Cafetero",c:["#3E8A4B","#7DBA6A","#8B4A2B"],d:{en:"The coffee region, where families grow some of the world's best coffee on steep green mountains. It is a UNESCO World Heritage site.",es:"La región donde las familias cultivan uno de los mejores cafés del mundo en montañas verdes y empinadas. Es Patrimonio de la Humanidad.",zh:"咖啡产区。农户在陡峭的青山上种出世界顶级的咖啡，这里是联合国教科文组织世界遗产。",ja:"急な緑の山で家族が世界有数のコーヒーを育てる地域。ユネスコの世界遺産です。",vi:"Vùng cà phê, nơi các gia đình trồng loại cà phê ngon hàng đầu thế giới trên núi xanh dốc đứng. Đây là Di sản Thế giới UNESCO.",ko:"가파른 초록 산에서 가족들이 세계 최고 수준의 커피를 기르는 지역. 유네스코 세계유산입니다."}},
{n:"Carnaval de Barranquilla",c:["#F7D154","#D91A5B","#1E6FD9","#2FA36B"],d:{en:"Four days of parades, masks and cumbia dancing. It is one of the biggest carnivals in the world.",es:"Cuatro días de desfiles, máscaras y cumbia. Es uno de los carnavales más grandes del mundo.",zh:"四天的游行、面具和昆比亚舞，是世界上最盛大的狂欢节之一。",ja:"パレード、仮面、クンビアの踊りが4日間続く、世界最大級のカーニバルです。",vi:"Bốn ngày diễu hành, mặt nạ và điệu nhảy cumbia. Đây là một trong những lễ hội carnival lớn nhất thế giới.",ko:"나흘 동안 퍼레이드와 가면, 쿰비아 춤이 이어지는 세계 최대 규모의 카니발 중 하나."}},
{n:"Aves",c:["#1E6FD9","#F7D154","#D91A5B"],d:{en:"Colombia has more than 1,900 kinds of birds, more than any other country, from hummingbirds to the Andean condor.",es:"Colombia tiene más de 1.900 especies de aves, más que cualquier otro país: desde colibríes hasta el cóndor de los Andes.",zh:"哥伦比亚有1900多种鸟类，居世界第一，从蜂鸟到安第斯神鹰应有尽有。",ja:"コロンビアにはハチドリからアンデスコンドルまで1,900種以上の鳥がいて、その数は世界一です。",vi:"Colombia có hơn 1.900 loài chim, nhiều hơn bất kỳ nước nào, từ chim ruồi đến thần ưng Andes.",ko:"콜롬비아에는 벌새부터 안데스콘도르까지 1,900종이 넘는 새가 살며, 이는 세계에서 가장 많습니다."}}
]},

dishes:[
{n:"Ceviche",c:["#FBF6EC","#B04A8C","#E8853A","#F7D154","#8CC152"],i:"pescado · limón · cebolla · ají · camote",d:{en:"Peru's national dish: fresh raw fish cured in lime juice with red onion and chili, served with sweet potato and corn.",es:"El plato bandera del Perú: pescado fresco curado en limón con cebolla roja y ají, servido con camote y choclo.",zh:"秘鲁的国菜：新鲜生鱼用青柠汁腌制，配红洋葱和辣椒，搭配红薯和玉米。",ja:"ペルーの国民食。新鮮な生の魚をライム果汁でしめ、赤玉ねぎと唐辛子を合わせ、さつまいもととうもろこしを添えます。",vi:"Món quốc hồn của Peru: cá tươi sống ngâm nước chanh với hành tím và ớt, ăn kèm khoai lang và ngô.",ko:"페루의 국민 음식. 신선한 날생선을 라임즙에 절여 적양파와 고추를 곁들이고 고구마, 옥수수와 함께 냅니다."}},
{n:"Lomo saltado",c:["#6B3A22","#D93B2B","#E9B45C","#F4F1E8"],i:"res · cebolla · tomate · sillao · papas",d:{en:"Beef stir-fried over high heat with onion, tomato and soy sauce, served with fries and rice. It was born from Chinese cooking in Peru.",es:"Carne de res salteada a fuego alto con cebolla, tomate y sillao, con papas fritas y arroz. Nació del encuentro con la cocina china.",zh:"大火快炒牛肉、洋葱、番茄和酱油，配薯条和米饭。这道菜源自秘鲁的中餐传统。",ja:"牛肉、玉ねぎ、トマトをしょうゆで強火で炒め、フライドポテトとごはんを添えます。ペルーの中華料理から生まれました。",vi:"Thịt bò xào lửa lớn với hành tây, cà chua và nước tương, ăn kèm khoai tây chiên và cơm. Món này ra đời từ ẩm thực Trung Hoa ở Peru.",ko:"소고기를 양파, 토마토, 간장과 함께 센 불에 볶아 감자튀김과 밥을 곁들입니다. 페루의 중국 요리에서 탄생했습니다."}},
{n:"Ají de gallina",c:["#F2C230","#F7E08A","#F4F1E8","#3B3B3B"],i:"pollo · ají amarillo · nueces · arroz",d:{en:"Shredded chicken in a creamy yellow chili sauce, served with rice, potato and a black olive.",es:"Pollo deshilachado en una crema de ají amarillo, servido con arroz, papa y una aceituna negra.",zh:"鸡丝配奶油黄辣椒酱，搭配米饭、土豆和一颗黑橄榄。",ja:"ほぐした鶏肉を黄色い唐辛子のクリームソースで煮込み、ごはん、じゃがいも、黒オリーブを添えます。",vi:"Gà xé trong sốt kem ớt vàng, ăn kèm cơm, khoai tây và một quả ô liu đen.",ko:"잘게 찢은 닭고기를 노란 고추 크림소스에 버무려 밥, 감자, 블랙 올리브와 함께 냅니다."}},
{n:"Causa limeña",c:["#F5CB3C","#F7E08A","#8CC152","#F4F1E8"],i:"papa amarilla · limón · ají · pollo o atún",d:{en:"A cold layered cake of yellow potato with lime and chili, filled with chicken or tuna and avocado.",es:"Un pastel frío de papa amarilla con limón y ají, relleno de pollo o atún y palta.",zh:"冷食的黄土豆泥千层，用青柠和辣椒调味，夹着鸡肉或金枪鱼和牛油果。",ja:"ライムと唐辛子で味つけした黄色いじゃがいもを重ね、鶏肉かツナ、アボカドをはさんだ冷たい料理です。",vi:"Bánh khoai tây vàng xếp lớp ăn lạnh, nêm chanh và ớt, nhân gà hoặc cá ngừ và bơ.",ko:"라임과 고추로 맛을 낸 노란 감자를 층층이 쌓고 닭고기나 참치, 아보카도를 넣은 차가운 요리."}},
{n:"Anticuchos",c:["#7A2E1D","#B5482A","#F7D154","#E9B45C"],i:"corazón de res · ají panca · papa · choclo",d:{en:"Skewers of marinated beef heart grilled over charcoal. They are the favorite street food at night.",es:"Brochetas de corazón de res marinado, asadas al carbón. Son la comida callejera favorita de la noche.",zh:"腌制牛心串，炭火烤制，是夜晚最受欢迎的街头小吃。",ja:"味つけした牛ハツの串を炭火で焼いたもの。夜の屋台でいちばん人気です。",vi:"Xiên tim bò ướp nướng than. Đây là món ăn đường phố được yêu thích nhất về đêm.",ko:"양념한 소 염통을 꼬치에 꿰어 숯불에 구운 음식. 밤거리에서 가장 사랑받는 길거리 음식입니다."}},
{n:"Picarones",c:["#C9772E","#E2A33A","#5B2C12"],i:"zapallo · camote · miel de chancaca",d:{en:"Rings of fried dough made with squash and sweet potato, covered in a dark sugarcane syrup.",es:"Aros fritos de masa de zapallo y camote, bañados en miel de chancaca.",zh:"用南瓜和红薯做的炸面圈，淋上深色的蔗糖浆。",ja:"かぼちゃとさつまいもの生地を輪にして揚げ、黒糖のシロップをかけたお菓子です。",vi:"Bánh vòng chiên làm từ bí và khoai lang, rưới mật mía sẫm màu.",ko:"호박과 고구마 반죽을 고리 모양으로 튀겨 진한 사탕수수 시럽을 뿌린 디저트."}}
],
things:[
{n:"Machu Picchu",c:["#BFE3F5","#6FA34A","#8C8C7A"],d:{en:"An Inca city built in the 1400s on top of a mountain. It is one of the New Seven Wonders of the World.",es:"Una ciudad inca construida en el siglo XV en lo alto de una montaña. Es una de las nuevas siete maravillas del mundo.",zh:"15世纪建在山顶的印加古城，是世界新七大奇迹之一。",ja:"1400年代に山の上に築かれたインカの都市。新・世界七不思議のひとつです。",vi:"Thành phố Inca xây trên đỉnh núi vào thế kỷ 15. Đây là một trong Bảy kỳ quan thế giới mới.",ko:"1400년대에 산 정상에 세워진 잉카 도시. 세계 신(新) 7대 불가사의 중 하나입니다."}},
{n:"Vinicunca",c:["#C9483B","#F2C230","#7DBAA0","#B07AA1"],d:{en:"The Rainbow Mountain. Minerals paint its slopes in stripes of red, yellow and turquoise, more than 5,000 meters high.",es:"La Montaña de Siete Colores. Los minerales pintan sus laderas en franjas rojas, amarillas y turquesa, a más de 5.000 metros de altura.",zh:"彩虹山。矿物质把山坡染成红、黄、青绿色的条纹，海拔超过5000米。",ja:"レインボーマウンテン。標高5,000m以上の山肌を、鉱物が赤、黄、ターコイズのしま模様に染めています。",vi:"Núi Cầu Vồng. Khoáng chất nhuộm sườn núi thành những dải đỏ, vàng và xanh ngọc ở độ cao hơn 5.000 mét.",ko:"무지개산. 해발 5,000m가 넘는 산비탈을 광물이 빨강, 노랑, 청록색 줄무늬로 물들입니다."}},
{n:"Lago Titicaca",c:["#1E6FD9","#5FB0E8","#F2C230"],d:{en:"The highest lake in the world that large boats can sail, at 3,812 meters. Families live on floating islands made of reeds.",es:"El lago navegable más alto del mundo, a 3.812 metros. Hay familias que viven en islas flotantes hechas de totora.",zh:"世界上海拔最高的通航湖泊，海拔3812米。有些家庭住在芦苇编成的浮岛上。",ja:"標高3,812m、大型船が航行できる世界一高い湖。葦で作った浮島に暮らす家族もいます。",vi:"Hồ cao nhất thế giới mà tàu lớn đi lại được, ở độ cao 3.812 mét. Có những gia đình sống trên đảo nổi làm từ cói.",ko:"해발 3,812m, 큰 배가 다닐 수 있는 세계에서 가장 높은 호수. 갈대로 만든 떠 있는 섬에 사는 가족들도 있습니다."}},
{n:"Líneas de Nazca",c:["#D9B98A","#C29A6B","#8B5E3C"],d:{en:"Giant drawings of a hummingbird, a monkey and a spider made in the desert about 2,000 years ago. You can only see them whole from the air.",es:"Dibujos gigantes de un colibrí, un mono y una araña trazados en el desierto hace unos 2.000 años. Solo se ven completos desde el aire.",zh:"约两千年前刻画在沙漠上的巨型蜂鸟、猴子和蜘蛛图案，只有从空中才能看到全貌。",ja:"約2,000年前に砂漠に描かれたハチドリ、サル、クモの巨大な絵。全体は空からしか見えません。",vi:"Những hình vẽ khổng lồ chim ruồi, khỉ và nhện trên sa mạc từ khoảng 2.000 năm trước. Chỉ nhìn thấy trọn vẹn từ trên không.",ko:"약 2,000년 전 사막에 그려진 벌새, 원숭이, 거미의 거대한 그림. 하늘에서만 전체를 볼 수 있습니다."}},
{n:"Amazonía",c:["#1F6B3A","#3E8A4B","#8B5E3C"],d:{en:"Rainforest covers more than half of Peru. Pink river dolphins, macaws and jaguars live there.",es:"La selva cubre más de la mitad del Perú. Allí viven delfines rosados, guacamayos y jaguares.",zh:"雨林覆盖了秘鲁一半以上的国土，那里生活着粉红河豚、金刚鹦鹉和美洲豹。",ja:"熱帯雨林がペルーの国土の半分以上をおおい、ピンクのカワイルカ、コンゴウインコ、ジャガーがすんでいます。",vi:"Rừng mưa bao phủ hơn một nửa Peru. Cá heo hồng, vẹt đuôi dài và báo đốm sống ở đó.",ko:"열대우림이 페루 국토의 절반 이상을 덮고 있으며, 분홍돌고래, 마코앵무, 재규어가 삽니다."}},
{n:"Cusco",c:["#B5482A","#E9B45C","#6B6B6B"],d:{en:"The old capital of the Inca Empire, 3,400 meters up in the Andes. Spanish buildings stand on perfectly fitted Inca stone walls.",es:"La antigua capital del Imperio inca, a 3.400 metros en los Andes. Los edificios españoles se levantan sobre muros incas de piedra perfectamente encajada.",zh:"印加帝国的古都，位于海拔3400米的安第斯山上。西班牙式建筑建在严丝合缝的印加石墙之上。",ja:"アンデスの標高3,400mにあるインカ帝国の古都。ぴったり組まれたインカの石壁の上にスペイン風の建物が立っています。",vi:"Cố đô của Đế chế Inca, ở độ cao 3.400 mét trên dãy Andes. Các tòa nhà Tây Ban Nha đứng trên những bức tường đá Inca ghép khít hoàn hảo.",ko:"안데스 해발 3,400m에 있는 잉카 제국의 옛 수도. 빈틈없이 맞물린 잉카 석벽 위에 스페인식 건물이 서 있습니다."}}
]}

"Bandeja paisa":{m:"⏱ 2 h · 👥 4",s:{
en:["Soak 2 cups of red beans overnight, then simmer them with salt for about 1.5 hours, until soft.","Cook white rice. Brown 300 g of ground beef with onion, tomato and cumin.","Fry strips of pork belly, slices of ripe plantain and one egg per person.","Serve it all on one big plate with avocado and an arepa."],
es:["Remoja 2 tazas de frijoles rojos toda la noche y cocínalos con sal alrededor de 1 hora y media, hasta que ablanden.","Prepara arroz blanco. Dora 300 g de carne molida con cebolla, tomate y comino.","Fríe tiras de chicharrón, tajadas de plátano maduro y un huevo por persona.","Sirve todo en un plato grande con aguacate y arepa."],
zh:["将2杯红豆浸泡一夜，加盐炖约1.5小时至软烂。","煮白米饭。将300克牛肉末与洋葱、番茄和孜然炒香。","煎五花肉条、熟大蕉片，每人一个煎蛋。","把所有食材盛在一个大盘里，配牛油果和玉米饼。"],
ja:["赤いんげん豆2カップを一晩水につけ、塩を加えて約1時間半、やわらかくなるまで煮る。","白いごはんを炊く。牛ひき肉300gを玉ねぎ、トマト、クミンと炒める。","豚バラ、熟したプランテンの薄切り、1人1個の卵を揚げ焼きにする。","大きな皿にすべて盛り、アボカドとアレパを添える。"],
vi:["Ngâm 2 chén đậu đỏ qua đêm, rồi ninh với muối khoảng 1 tiếng rưỡi cho mềm.","Nấu cơm trắng. Xào 300 g thịt bò xay với hành tây, cà chua và thì là Ai Cập.","Chiên ba chỉ, chuối chín cắt lát và mỗi người một quả trứng.","Bày tất cả lên một đĩa lớn, ăn kèm bơ và bánh arepa."],
ko:["붉은 강낭콩 2컵을 하룻밤 불린 뒤 소금을 넣고 약 1시간 30분 동안 부드러워질 때까지 삶습니다.","흰쌀밥을 짓습니다. 다진 소고기 300g을 양파, 토마토, 커민과 함께 볶습니다.","삼겹살, 잘 익은 플랜틴 조각, 1인당 달걀 1개를 튀기듯 굽습니다.","큰 접시에 모두 담고 아보카도와 아레파를 곁들입니다."]}},
"Ajiaco":{m:"⏱ 1 h · 👥 4",s:{
en:["Simmer 2 chicken breasts with 2 ears of corn, scallion and cilantro in 2 liters of water for 30 minutes. Take out the chicken and shred it.","Add three kinds of potato, sliced: small yellow, red and white. Cook 30 minutes, until the yellow ones dissolve and thicken the soup.","Add 2 tablespoons of dried guascas and simmer 5 more minutes.","Serve with the chicken, cream, capers and avocado."],
es:["Cocina 2 pechugas de pollo con 2 mazorcas, cebolla larga y cilantro en 2 litros de agua por 30 minutos. Saca el pollo y desméchalo.","Agrega tres tipos de papa en rodajas: criolla, pastusa y sabanera. Cocina 30 minutos, hasta que la criolla se deshaga y espese la sopa.","Añade 2 cucharadas de guascas secas y deja 5 minutos más.","Sirve con el pollo, crema de leche, alcaparras y aguacate."],
zh:["将2块鸡胸肉与2根玉米、葱和香菜放入2升水中煮30分钟，取出鸡肉撕成丝。","加入切片的三种土豆（小黄土豆、红土豆和白土豆），煮30分钟，直到黄土豆化开、汤变浓。","加入2汤匙干guascas香草，再煮5分钟。","盛碗后配鸡丝、奶油、刺山柑和牛油果。"],
ja:["鶏むね肉2枚、とうもろこし2本、青ねぎ、パクチーを水2リットルで30分煮る。鶏肉を取り出してほぐす。","3種類のじゃがいも（小さな黄色、赤、白）を薄切りにして加え、黄色いいもが煮くずれてとろみがつくまで30分煮る。","乾燥グアスカス大さじ2を加え、さらに5分煮る。","鶏肉、生クリーム、ケッパー、アボカドを添えていただく。"],
vi:["Ninh 2 miếng ức gà với 2 bắp ngô, hành lá và ngò trong 2 lít nước 30 phút. Vớt gà ra và xé sợi.","Thêm ba loại khoai tây cắt lát (vàng nhỏ, đỏ và trắng). Nấu 30 phút đến khi khoai vàng tan ra làm súp sánh lại.","Cho 2 muỗng canh lá guascas khô, nấu thêm 5 phút.","Ăn kèm gà xé, kem, nụ bạch hoa và bơ."],
ko:["닭가슴살 2쪽을 옥수수 2개, 쪽파, 고수와 함께 물 2리터에 30분 끓입니다. 닭고기를 건져 잘게 찢습니다.","세 가지 감자(작은 노란 감자, 붉은 감자, 흰 감자)를 썰어 넣고, 노란 감자가 풀어져 국물이 걸쭉해질 때까지 30분 끓입니다.","말린 구아스카스 2큰술을 넣고 5분 더 끓입니다.","닭고기, 크림, 케이퍼, 아보카도를 곁들여 냅니다."]}},
"Arepa":{m:"⏱ 20 min · 👥 6",s:{
en:["Mix 2 cups of precooked corn flour (masarepa) with 2½ cups of warm water and 1 teaspoon of salt. Rest 5 minutes.","Shape the dough into balls and flatten them into discs about 1 cm thick.","Cook on a hot griddle about 5 minutes per side, until golden.","Eat warm with butter and fresh cheese."],
es:["Mezcla 2 tazas de harina de maíz precocida con 2½ tazas de agua tibia y 1 cucharadita de sal. Deja reposar 5 minutos.","Forma bolitas con la masa y aplánalas en discos de 1 cm de grosor.","Ásalas en una plancha caliente unos 5 minutos por cada lado, hasta que doren.","Cómelas calientes con mantequilla y queso fresco."],
zh:["将2杯预熟玉米粉（masarepa）与2½杯温水和1茶匙盐拌匀，静置5分钟。","把面团搓成球，压成约1厘米厚的圆饼。","放在热铁板上每面烙约5分钟，至金黄。","趁热配黄油和新鲜奶酪吃。"],
ja:["調理済みとうもろこし粉（マサレパ）2カップに、ぬるま湯2½カップと塩小さじ1を混ぜ、5分休ませる。","生地を丸めて、厚さ約1cmの円盤にする。","熱した鉄板で片面約5分ずつ、きつね色になるまで焼く。","温かいうちにバターとフレッシュチーズでいただく。"],
vi:["Trộn 2 chén bột ngô chín sẵn (masarepa) với 2½ chén nước ấm và 1 muỗng cà phê muối. Để nghỉ 5 phút.","Vo bột thành viên rồi ép dẹt thành bánh dày khoảng 1 cm.","Nướng trên chảo nóng khoảng 5 phút mỗi mặt đến khi vàng.","Ăn nóng với bơ và phô mai tươi."],
ko:["익힌 옥수수 가루(마사레파) 2컵에 따뜻한 물 2½컵과 소금 1작은술을 섞고 5분간 둡니다.","반죽을 동그랗게 빚어 약 1cm 두께로 납작하게 만듭니다.","뜨거운 팬에서 한 면당 약 5분씩 노릇하게 굽습니다.","따뜻할 때 버터와 생치즈를 곁들여 먹습니다."]}},
"Sancocho":{m:"⏱ 1 h 15 min · 👥 6",s:{
en:["Brown 1 kg of chicken or beef pieces with onion, garlic and cilantro in a large pot.","Add 3 liters of water, 2 green plantains in chunks and 3 ears of corn. Simmer 30 minutes.","Add 500 g of cassava and 4 potatoes. Cook 25 minutes more, until everything is tender.","Serve with white rice, avocado and fresh cilantro."],
es:["Dora 1 kg de pollo o carne de res en presas con cebolla, ajo y cilantro en una olla grande.","Agrega 3 litros de agua, 2 plátanos verdes en trozos y 3 mazorcas. Cocina 30 minutos.","Añade 500 g de yuca y 4 papas. Cocina 25 minutos más, hasta que todo esté blando.","Sirve con arroz blanco, aguacate y cilantro fresco."],
zh:["在大锅中将1公斤鸡块或牛肉块与洋葱、大蒜和香菜一起煎香。","加入3升水、2根切块的青大蕉和3根玉米，煮30分钟。","加入500克木薯和4个土豆，再煮25分钟，直到全部软烂。","配白米饭、牛油果和新鲜香菜。"],
ja:["大きな鍋で鶏肉または牛肉1kgを玉ねぎ、にんにく、パクチーと一緒に焼きつける。","水3リットル、ぶつ切りの青いプランテン2本、とうもろこし3本を加えて30分煮る。","キャッサバ500gとじゃがいも4個を加え、全体がやわらかくなるまでさらに25分煮る。","白いごはん、アボカド、生のパクチーを添える。"],
vi:["Xào 1 kg thịt gà hoặc thịt bò chặt miếng với hành tây, tỏi và ngò trong nồi lớn.","Thêm 3 lít nước, 2 quả chuối xanh cắt khúc và 3 bắp ngô. Ninh 30 phút.","Cho 500 g sắn và 4 củ khoai tây. Nấu thêm 25 phút đến khi tất cả mềm.","Ăn kèm cơm trắng, bơ và ngò tươi."],
ko:["큰 냄비에 닭고기나 소고기 1kg을 양파, 마늘, 고수와 함께 볶습니다.","물 3리터, 큼직하게 썬 초록 플랜틴 2개, 옥수수 3개를 넣고 30분 끓입니다.","카사바 500g과 감자 4개를 넣고 모두 부드러워질 때까지 25분 더 끓입니다.","흰쌀밥, 아보카도, 신선한 고수를 곁들입니다."]}},
"Empanadas":{m:"⏱ 1 h · 👥 12",s:{
en:["Filling: mash 2 boiled potatoes with 250 g of shredded cooked beef, sautéed onion and tomato, cumin and salt.","Dough: mix 2 cups of yellow precooked corn flour with 2 cups of warm water and salt.","Flatten small balls of dough between two sheets of plastic, add a spoonful of filling, fold in half and seal the edge.","Fry in hot oil (180 °C) until golden and crisp. Serve with ají sauce and lime."],
es:["Relleno: tritura 2 papas cocidas con 250 g de carne desmechada, hogao de cebolla y tomate, comino y sal.","Masa: mezcla 2 tazas de harina de maíz amarilla precocida con 2 tazas de agua tibia y sal.","Aplana bolitas de masa entre dos plásticos, pon una cucharada de relleno, dobla por la mitad y sella el borde.","Fríe en aceite caliente (180 °C) hasta que estén doradas y crocantes. Sirve con ají y limón."],
zh:["馅料：将2个煮熟的土豆与250克熟牛肉丝、炒香的洋葱番茄、孜然和盐一起捣碎。","面团：将2杯黄色预熟玉米粉与2杯温水和盐拌匀。","把小面团夹在两层保鲜膜之间压平，放一勺馅，对折并封口。","在180°C的热油中炸至金黄酥脆，配ají辣酱和青柠。"],
ja:["具：ゆでたじゃがいも2個をつぶし、ほぐした牛肉250g、炒めた玉ねぎとトマト、クミン、塩と混ぜる。","生地：黄色い調理済みとうもろこし粉2カップに、ぬるま湯2カップと塩を混ぜる。","小さく丸めた生地を2枚のラップではさんで平らにし、具をスプーン1杯のせて半分に折り、縁を閉じる。","180℃の油できつね色にカリッと揚げる。アヒソースとライムを添える。"],
vi:["Nhân: nghiền 2 củ khoai tây luộc với 250 g thịt bò chín xé, hành tây và cà chua xào, thì là Ai Cập và muối.","Bột: trộn 2 chén bột ngô vàng chín sẵn với 2 chén nước ấm và muối.","Ép dẹt từng viên bột nhỏ giữa hai tấm ni lông, cho một muỗng nhân, gập đôi và miết kín mép.","Chiên trong dầu nóng (180 °C) đến khi vàng giòn. Ăn kèm sốt ají và chanh."],
ko:["소: 삶은 감자 2개를 으깨어 잘게 찢은 익힌 소고기 250g, 볶은 양파와 토마토, 커민, 소금과 섞습니다.","반죽: 노란 익힌 옥수수 가루 2컵에 따뜻한 물 2컵과 소금을 섞습니다.","작은 반죽을 비닐 두 장 사이에 넣어 납작하게 펴고, 소를 한 숟가락 올린 뒤 반으로 접어 가장자리를 붙입니다.","180°C 기름에 노릇하고 바삭하게 튀깁니다. 아히 소스와 라임을 곁들입니다."]}},
"Buñuelos":{m:"⏱ 30 min · 👥 15",s:{
en:["Mix 2 cups of finely grated salty white cheese (costeño or feta), 1 cup of cassava starch, 1 egg and 1 tablespoon of sugar. Add a little milk if the dough is dry.","Knead until smooth and roll into balls the size of a walnut.","Fry in oil over medium-low heat (about 160 °C) for 8 to 10 minutes. The balls turn by themselves as they puff up.","Drain on paper and eat warm."],
es:["Mezcla 2 tazas de queso costeño rallado fino, 1 taza de almidón de yuca, 1 huevo y 1 cucharada de azúcar. Agrega un poco de leche si la masa queda seca.","Amasa hasta que quede suave y forma bolitas del tamaño de una nuez.","Fríe en aceite a fuego medio-bajo (unos 160 °C) de 8 a 10 minutos. Las bolitas se voltean solas mientras se inflan.","Escurre en papel y cómelos calientes."],
zh:["将2杯磨细的咸白奶酪（costeño或菲达奶酪）、1杯木薯淀粉、1个鸡蛋和1汤匙糖拌匀。面团太干可加少许牛奶。","揉至光滑，搓成核桃大小的球。","用中小火（约160°C）油炸8到10分钟，面球膨胀时会自己翻转。","放在纸上沥油，趁热吃。"],
ja:["細かくおろした塩気のある白チーズ（コステーニョまたはフェタ）2カップ、キャッサバでんぷん1カップ、卵1個、砂糖大さじ1を混ぜる。生地がかたければ牛乳を少し加える。","なめらかになるまでこね、くるみ大に丸める。","中弱火（約160℃）の油で8〜10分揚げる。ふくらみながら自然に回転する。","紙で油を切り、温かいうちにいただく。"],
vi:["Trộn 2 chén phô mai trắng mặn bào mịn (costeño hoặc feta), 1 chén bột sắn, 1 quả trứng và 1 muỗng canh đường. Thêm chút sữa nếu bột khô.","Nhồi cho mịn rồi vo thành viên cỡ quả óc chó.","Chiên trong dầu ở lửa vừa nhỏ (khoảng 160 °C) từ 8 đến 10 phút. Viên bột tự xoay khi phồng lên.","Để ráo dầu trên giấy và ăn nóng."],
ko:["곱게 간 짭짤한 흰 치즈(코스테뇨 또는 페타) 2컵, 카사바 전분 1컵, 달걀 1개, 설탕 1큰술을 섞습니다. 반죽이 되면 우유를 조금 넣습니다.","매끈해질 때까지 치댄 뒤 호두 크기로 동그랗게 빚습니다.","중약불(약 160°C) 기름에서 8~10분 튀깁니다. 부풀면서 저절로 돌아갑니다.","종이에 올려 기름을 빼고 따뜻할 때 먹습니다."]}},
"Ceviche":{m:"⏱ 20 min · 👥 4",s:{
en:["Cut 500 g of very fresh white fish into 2 cm cubes and season with salt.","Add half a red onion in thin slices, 1 chopped chili and cilantro.","Cover with the juice of 10 to 12 limes and let it rest 5 to 10 minutes.","Serve right away with boiled sweet potato and corn."],
es:["Corta 500 g de pescado blanco muy fresco en cubos de 2 cm y sazona con sal.","Agrega media cebolla roja en pluma, 1 ají limo picado y cilantro.","Cubre con el jugo de 10 a 12 limones y deja reposar de 5 a 10 minutos.","Sirve de inmediato con camote sancochado y choclo."],
zh:["将500克非常新鲜的白肉鱼切成2厘米见方的小块，撒盐调味。","加入半个切细丝的红洋葱、1个切碎的辣椒和香菜。","倒入10到12个青柠的汁没过鱼肉，静置5到10分钟。","立即上桌，配煮红薯和玉米。"],
ja:["とても新鮮な白身魚500gを2cm角に切り、塩をふる。","薄切りの赤玉ねぎ1/2個、刻んだ唐辛子1本、パクチーを加える。","ライム10〜12個分の果汁をかけ、5〜10分おく。","ゆでたさつまいもととうもろこしを添えて、すぐにいただく。"],
vi:["Cắt 500 g cá thịt trắng thật tươi thành khối 2 cm và nêm muối.","Thêm nửa củ hành tím thái mỏng, 1 quả ớt băm và ngò.","Rưới nước cốt của 10 đến 12 quả chanh cho ngập cá, để 5 đến 10 phút.","Dọn ngay với khoai lang luộc và ngô."],
ko:["아주 신선한 흰살생선 500g을 2cm 크기로 깍둑썰어 소금으로 간합니다.","얇게 썬 적양파 반 개, 다진 고추 1개, 고수를 넣습니다.","라임 10~12개의 즙을 부어 5~10분 둡니다.","삶은 고구마와 옥수수를 곁들여 바로 냅니다."]}},
"Lomo saltado":{m:"⏱ 30 min · 👥 4",s:{
en:["Cut 500 g of beef sirloin into strips and season with salt, pepper and cumin.","Sear the beef in a very hot pan or wok with a little oil for 1 to 2 minutes.","Add 1 red onion and 2 tomatoes in thick wedges, then 2 tablespoons of soy sauce and 1 of vinegar. Toss for 1 minute.","Finish with cilantro and serve with french fries and white rice."],
es:["Corta 500 g de lomo de res en tiras y sazona con sal, pimienta y comino.","Saltea la carne en una sartén o wok muy caliente con un poco de aceite de 1 a 2 minutos.","Agrega 1 cebolla roja y 2 tomates en gajos gruesos, luego 2 cucharadas de sillao y 1 de vinagre. Saltea 1 minuto.","Termina con cilantro y sirve con papas fritas y arroz blanco."],
zh:["将500克牛里脊切条，用盐、胡椒和孜然调味。","在烧得很热的锅中放少许油，将牛肉大火快炒1到2分钟。","加入切成厚瓣的1个红洋葱和2个番茄，再加2汤匙酱油和1汤匙醋，翻炒1分钟。","撒上香菜，配薯条和白米饭。"],
ja:["牛サーロイン500gを細切りにし、塩、こしょう、クミンで下味をつける。","よく熱したフライパンか中華鍋に油を少し入れ、牛肉を1〜2分強火で炒める。","くし切りの赤玉ねぎ1個とトマト2個を加え、しょうゆ大さじ2と酢大さじ1を入れて1分炒め合わせる。","パクチーを散らし、フライドポテトと白いごはんを添える。"],
vi:["Cắt 500 g thăn bò thành sợi, ướp muối, tiêu và thì là Ai Cập.","Xào bò trong chảo thật nóng với chút dầu từ 1 đến 2 phút.","Thêm 1 củ hành tím và 2 quả cà chua cắt múi dày, rồi 2 muỗng canh nước tương và 1 muỗng canh giấm. Đảo 1 phút.","Rắc ngò và ăn kèm khoai tây chiên và cơm trắng."],
ko:["소고기 등심 500g을 길게 썰어 소금, 후추, 커민으로 밑간합니다.","아주 뜨겁게 달군 팬이나 웍에 기름을 조금 두르고 소고기를 1~2분 볶습니다.","굵게 썬 적양파 1개와 토마토 2개를 넣고, 간장 2큰술과 식초 1큰술을 넣어 1분 볶습니다.","고수를 올리고 감자튀김, 흰쌀밥과 함께 냅니다."]}},
"Ají de gallina":{m:"⏱ 50 min · 👥 4",s:{
en:["Boil 2 chicken breasts for 25 minutes. Shred them and keep the broth.","Blend 3 tablespoons of ají amarillo paste with 4 slices of bread soaked in 1 cup of milk.","Sauté 1 onion and 2 garlic cloves, add the blend, the chicken, a handful of ground walnuts and Parmesan. Simmer 10 minutes, adding broth until creamy.","Serve over sliced boiled potato with rice, boiled egg and a black olive."],
es:["Hierve 2 pechugas de pollo por 25 minutos. Deshiláchalas y guarda el caldo.","Licúa 3 cucharadas de pasta de ají amarillo con 4 rebanadas de pan remojadas en 1 taza de leche.","Sofríe 1 cebolla y 2 dientes de ajo, agrega el licuado, el pollo, un puñado de nueces molidas y queso parmesano. Cocina 10 minutos, añadiendo caldo hasta que quede cremoso.","Sirve sobre papa sancochada en rodajas, con arroz, huevo duro y una aceituna negra."],
zh:["将2块鸡胸肉煮25分钟，撕成丝，留下鸡汤。","将3汤匙黄辣椒酱与用1杯牛奶泡软的4片面包一起打成糊。","炒香1个洋葱和2瓣大蒜，加入辣椒糊、鸡丝、一把核桃碎和帕尔马干酪，小火煮10分钟，边煮边加鸡汤至浓稠顺滑。","浇在煮土豆片上，配米饭、水煮蛋和一颗黑橄榄。"],
ja:["鶏むね肉2枚を25分ゆでる。ほぐして、ゆで汁はとっておく。","アヒ・アマリージョのペースト大さじ3と、牛乳1カップにひたした食パン4枚をミキサーにかける。","玉ねぎ1個とにんにく2片を炒め、ミキサーにかけたもの、鶏肉、砕いたくるみひとつかみ、パルメザンチーズを加える。ゆで汁を足しながらクリーム状になるまで10分煮る。","ゆでたじゃがいもの薄切りにかけ、ごはん、ゆで卵、黒オリーブを添える。"],
vi:["Luộc 2 miếng ức gà 25 phút. Xé sợi và giữ lại nước luộc.","Xay 3 muỗng canh sốt ớt vàng (ají amarillo) với 4 lát bánh mì ngâm trong 1 chén sữa.","Phi 1 củ hành tây và 2 tép tỏi, cho hỗn hợp xay, gà, một nắm óc chó xay và phô mai Parmesan. Nấu 10 phút, thêm nước luộc đến khi sánh mịn.","Rưới lên khoai tây luộc cắt lát, ăn kèm cơm, trứng luộc và một quả ô liu đen."],
ko:["닭가슴살 2쪽을 25분 삶습니다. 잘게 찢고 육수는 남겨 둡니다.","아히 아마리요 페이스트 3큰술과 우유 1컵에 적신 식빵 4장을 함께 갑니다.","양파 1개와 마늘 2쪽을 볶다가 간 것, 닭고기, 다진 호두 한 줌, 파르메산 치즈를 넣습니다. 육수를 넣어 가며 크리미해질 때까지 10분 끓입니다.","얇게 썬 삶은 감자 위에 올리고 밥, 삶은 달걀, 블랙 올리브를 곁들입니다."]}},
"Causa limeña":{m:"⏱ 40 min + 1 h · 👥 6",s:{
en:["Boil 1 kg of yellow potatoes and mash them. Mix with the juice of 3 limes, 2 tablespoons of ají amarillo paste, 3 tablespoons of oil and salt.","Mix 2 cups of shredded chicken or tuna with mayonnaise and chopped onion.","In a mold, layer potato, sliced avocado, the filling and potato again.","Chill for 1 hour. Top with boiled egg and olives."],
es:["Sancocha 1 kg de papa amarilla y prénsala. Mezcla con el jugo de 3 limones, 2 cucharadas de pasta de ají amarillo, 3 cucharadas de aceite y sal.","Mezcla 2 tazas de pollo deshilachado o atún con mayonesa y cebolla picada.","En un molde, arma capas: papa, palta en láminas, el relleno y otra vez papa.","Refrigera 1 hora. Decora con huevo duro y aceitunas."],
zh:["将1公斤黄土豆煮熟压成泥，加入3个青柠的汁、2汤匙黄辣椒酱、3汤匙油和盐拌匀。","将2杯鸡丝或金枪鱼与蛋黄酱和洋葱碎拌匀。","在模具中依次铺上土豆泥、牛油果片、馅料，再铺一层土豆泥。","冷藏1小时，用水煮蛋和橄榄装饰。"],
ja:["黄色いじゃがいも1kgをゆでてつぶし、ライム3個分の果汁、アヒ・アマリージョのペースト大さじ2、油大さじ3、塩を混ぜる。","ほぐした鶏肉またはツナ2カップを、マヨネーズと刻んだ玉ねぎであえる。","型に、じゃがいも、アボカドの薄切り、具、じゃがいもの順に重ねる。","1時間冷やし、ゆで卵とオリーブを飾る。"],
vi:["Luộc 1 kg khoai tây vàng rồi nghiền nhuyễn. Trộn với nước cốt 3 quả chanh, 2 muỗng canh sốt ớt vàng, 3 muỗng canh dầu và muối.","Trộn 2 chén gà xé hoặc cá ngừ với mayonnaise và hành tây băm.","Xếp lớp trong khuôn: khoai tây, bơ cắt lát, nhân, rồi lại khoai tây.","Để lạnh 1 tiếng. Trang trí với trứng luộc và ô liu."],
ko:["노란 감자 1kg을 삶아 으깹니다. 라임 3개의 즙, 아히 아마리요 페이스트 2큰술, 식용유 3큰술, 소금을 넣어 섞습니다.","잘게 찢은 닭고기나 참치 2컵을 마요네즈, 다진 양파와 섞습니다.","틀에 감자, 얇게 썬 아보카도, 속 재료, 다시 감자 순으로 쌓습니다.","1시간 차게 식힌 뒤 삶은 달걀과 올리브로 장식합니다."]}},
"Anticuchos":{m:"⏱ 30 min + 4 h · 👥 4",s:{
en:["Cut 1 kg of beef heart (or sirloin) into 3 cm cubes.","Marinate at least 4 hours in 4 tablespoons of ají panca paste, ½ cup of red vinegar, 4 crushed garlic cloves, cumin, oregano and salt.","Thread 3 or 4 pieces on each skewer. Grill over high heat 3 to 4 minutes per side, brushing with the marinade.","Serve with boiled potato and corn."],
es:["Corta 1 kg de corazón de res (o lomo) en cubos de 3 cm.","Marina al menos 4 horas en 4 cucharadas de pasta de ají panca, ½ taza de vinagre tinto, 4 dientes de ajo molidos, comino, orégano y sal.","Ensarta 3 o 4 trozos en cada palito. Asa a fuego alto de 3 a 4 minutos por lado, pincelando con la marinada.","Sirve con papa sancochada y choclo."],
zh:["将1公斤牛心（或牛里脊）切成3厘米见方的块。","用4汤匙ají panca辣椒酱、½杯红酒醋、4瓣蒜泥、孜然、牛至和盐腌制至少4小时。","每根竹签串3到4块肉，大火每面烤3到4分钟，边烤边刷腌料。","配煮土豆和玉米。"],
ja:["牛ハツ（またはサーロイン）1kgを3cm角に切る。","アヒ・パンカのペースト大さじ4、赤ワインビネガー½カップ、つぶしたにんにく4片、クミン、オレガノ、塩で4時間以上漬け込む。","1本の串に3〜4切れ刺す。漬けだれを塗りながら、強火で片面3〜4分ずつ焼く。","ゆでたじゃがいもととうもろこしを添える。"],
vi:["Cắt 1 kg tim bò (hoặc thăn bò) thành khối 3 cm.","Ướp ít nhất 4 tiếng với 4 muỗng canh sốt ớt ají panca, ½ chén giấm đỏ, 4 tép tỏi giã, thì là Ai Cập, oregano và muối.","Xiên 3 hoặc 4 miếng mỗi que. Nướng lửa lớn 3 đến 4 phút mỗi mặt, vừa nướng vừa phết nước ướp.","Ăn kèm khoai tây luộc và ngô."],
ko:["소 염통(또는 등심) 1kg을 3cm 크기로 깍둑썹니다.","아히 판카 페이스트 4큰술, 레드와인 식초 ½컵, 다진 마늘 4쪽, 커민, 오레가노, 소금에 4시간 이상 재웁니다.","꼬치 하나에 3~4조각씩 꿰어, 양념을 발라 가며 센 불에서 한 면당 3~4분 굽습니다.","삶은 감자와 옥수수를 곁들입니다."]}},
"Picarones":{m:"⏱ 2 h · 👥 20",s:{
en:["Boil 250 g of squash and 250 g of sweet potato until soft, then mash them.","Mix the mash with 2 cups of flour, 1 tablespoon of dry yeast, 2 tablespoons of sugar and a pinch of anise. Let the dough rise for 1 hour.","With wet fingers, shape rings of dough and fry them in hot oil until golden.","Syrup: simmer 250 g of chancaca or dark brown sugar with 1 cup of water, cinnamon, cloves and orange peel until thick. Pour it over the rings."],
es:["Sancocha 250 g de zapallo y 250 g de camote hasta que ablanden y hazlos puré.","Mezcla el puré con 2 tazas de harina, 1 cucharada de levadura seca, 2 cucharadas de azúcar y una pizca de anís. Deja leudar la masa 1 hora.","Con los dedos mojados, forma aros de masa y fríelos en aceite caliente hasta que doren.","Miel: hierve 250 g de chancaca con 1 taza de agua, canela, clavo y cáscara de naranja hasta que espese. Baña los picarones."],
zh:["将250克南瓜和250克红薯煮软，压成泥。","将薯泥与2杯面粉、1汤匙干酵母、2汤匙糖和少许茴香拌匀，发酵1小时。","手指沾水，把面糊捏成圈，放入热油中炸至金黄。","糖浆：将250克chancaca粗糖或黑糖与1杯水、肉桂、丁香和橙皮一起熬至浓稠，淋在面圈上。"],
ja:["かぼちゃ250gとさつまいも250gをやわらかくゆでて、つぶす。","つぶしたものに小麦粉2カップ、ドライイースト大さじ1、砂糖大さじ2、アニス少々を混ぜ、1時間発酵させる。","ぬらした指で生地を輪にして、熱した油できつね色に揚げる。","シロップ：チャンカカ（または黒糖）250gを水1カップ、シナモン、クローブ、オレンジの皮と一緒にとろみがつくまで煮詰め、上からかける。"],
vi:["Luộc 250 g bí đỏ và 250 g khoai lang cho mềm rồi nghiền nhuyễn.","Trộn phần nghiền với 2 chén bột mì, 1 muỗng canh men khô, 2 muỗng canh đường và một chút hồi. Ủ bột 1 tiếng.","Làm ướt ngón tay, nặn bột thành vòng và chiên trong dầu nóng đến khi vàng.","Mật: nấu 250 g đường chancaca hoặc đường nâu sẫm với 1 chén nước, quế, đinh hương và vỏ cam đến khi sánh. Rưới lên bánh."],
ko:["호박 250g과 고구마 250g을 부드럽게 삶아 으깹니다.","으깬 것에 밀가루 2컵, 드라이이스트 1큰술, 설탕 2큰술, 아니스 약간을 섞어 1시간 발효시킵니다.","손가락에 물을 묻혀 반죽을 고리 모양으로 만들어 뜨거운 기름에 노릇하게 튀깁니다.","시럽: 찬카카(또는 흑설탕) 250g을 물 1컵, 계피, 정향, 오렌지 껍질과 함께 걸쭉해질 때까지 졸여 위에 뿌립니다."]}}

const VL={en:"en-US",es:"es-US",zh:"zh-CN",ja:"ja-JP",vi:"vi-VN",ko:"ko-KR"};
const canSpeak="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
let speaking=null;
function stopSpeak(){speaking=null;if(canSpeak)try{speechSynthesis.cancel()}catch(e){}}
function speak(id,text){
  if(!canSpeak)return;
  if(speaking===id){stopSpeak();render();return}
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang=VL[S.lang];u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(S.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{if(speaking===id){speaking=null;render()}};
    speaking=id;speechSynthesis.speak(u)}catch(e){speaking=null}
  render();
}
function listenBtn(id,getText){const b=el("button","want listen",speaking===id?"■ "+t("stop"):"🔊 "+t("listen"));b.type="button";b.setAttribute("aria-pressed",String(speaking===id));b.onclick=()=>speak(id,getText());return b}
if(canSpeak)try{speechSynthesis.getVoices()}catch(e){}
let S={screen:"home",lang:"en",name:"",from:"",country:"co",tab:"dishes",want:[],quiz:null,open:null,prev:"home",rec:false};
const ORDER=["home","register","lang","intro","choose"];
const BACK={register:"home",lang:"register",intro:"lang",choose:"intro",country:"choose",quiz:"choose"};
const $=id=>document.getElementById(id);
const t=(k,v)=>{let s=(T[k][S.lang]||T[k].en);if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
function save(){try{localStorage.setItem("cope",JSON.stringify({lang:S.lang,name:S.name,from:S.from,want:S.want}))}catch(e){}}
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem("cope")||"{}"))}catch(e){}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function conic(c){const n=c.length;return "conic-gradient("+c.map((x,i)=>x+" "+(i*360/n)+"deg "+((i+1)*360/n)+"deg").join(",")+")"}
function bands(c){const n=c.length;return "linear-gradient(160deg,"+c.map((x,i)=>x+" "+(i*100/n)+"% "+((i+1)*100/n)+"%").join(",")+")"}

function render(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("evt").textContent=t("evt");
  $("langbtn").textContent=S.lang.toUpperCase();
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id==="s-"+S.screen));
  $("back").hidden=!BACK[S.screen]&&S.screen!=="credits";
  const idx=ORDER.indexOf(S.screen);const step=idx<0?5:idx+1;
  [...$("steps").children].forEach((d,i)=>d.classList.toggle("on",i<step));
  // languages
  const L=$("langs");L.textContent="";
  LANGS.forEach(([c,n])=>{const b=el("button","opt");b.type="button";b.setAttribute("aria-pressed",String(c===S.lang));b.append(el("b","",n),el("span","",c.toUpperCase()));b.onclick=()=>{stopSpeak();S.lang=c;save();render()};L.append(b)});
  $("hello").textContent=S.name?t("hello",{n:S.name}):"";
  $("tally").textContent=S.want.length?t("tally",{n:S.want.length}):"";
  document.body.classList.toggle("home",S.screen==="home");
  const il=$("introlisten");il.textContent="";if(canSpeak)il.append(listenBtn("intro",()=>t("introTitle")+". "+t("intro1")+" "+t("intro2")));
  const wr=$("wantrow");wr.textContent="";S.want.forEach(n=>{if(PH[n])wr.append(pimg(n,"s"))});
  if(S.screen==="credits")renderCredits();
  renderSheet();
  if(S.screen==="country")renderCountry();
  if(S.screen==="quiz")renderQuiz();
}
function renderCountry(){
  const C=DATA[S.country];
  $("cflag").className="miniflag "+S.country;$("cname").textContent=CN[S.country];
  const F=$("facts");F.textContent="";
  [["capital",C.capital],["currency",C.currency]].forEach(([k,v])=>{const f=el("div","fact");f.append(el("small","",t(k)),document.createTextNode(v));F.append(f)});
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  const list=$("list");list.textContent="";
  C[S.tab].forEach((it,ix)=>{
    const b=el("button","tile"+(ix===0?" big":""));b.type="button";b.style.background=bands(it.c);
    b.append(pimg(it.n,ix===0?"l":"m"),el("b","",it.n));
    if(S.want.includes(it.n))b.append(el("span","heart","♥"));
    b.onclick=()=>{stopSpeak();S.rec=false;S.open=it.n;renderSheet()};list.append(b)});
}
function closeSheet(){S.open=null;S.rec=false;stopSpeak();renderSheet()}
function renderSheet(){
  const bg=$("sheetbg");if(!S.open||!findItem(S.open)){bg.hidden=true;return}
  const it=findItem(S.open),sh=$("sheet");bg.hidden=false;
  const ph=el("div","sheetph");ph.style.background=bands(it.c);ph.append(pimg(it.n,"l"));
  const x=el("button","iconbtn sheetx","×");x.type="button";x.setAttribute("aria-label","Close");x.onclick=closeSheet;ph.append(x);
  const body=el("div","sheetbody");body.append(el("h2","",it.n),el("p","",it.d[S.lang]||it.d.en));
  const rc=R[it.n],steps=rc&&(rc.s[S.lang]||rc.s.en);
  if(canSpeak)body.append(listenBtn("sheet:"+it.n,()=>it.n+". "+(it.d[S.lang]||it.d.en)+(S.rec&&steps?" "+t("recipeT")+". "+steps.join(" "):"")));
  if(it.i){const ch=el("div","chips");it.i.split(" · ").forEach(v=>ch.append(el("span","chip",v)));body.append(ch);
    if(rc){
      if(S.rec){const bx=el("div","recipe");bx.append(el("h3","",t("recipeT")),el("small","",rc.m));const ol=el("ol");steps.forEach(x=>ol.append(el("li","",x)));bx.append(ol);body.append(bx)}
      else{const rb=el("button","btn wide",t("recipe"));rb.type="button";rb.onclick=()=>{S.rec=true;const y=sh.scrollTop;renderSheet();sh.scrollTop=y};body.append(rb)}
    }
    const on=S.want.includes(it.n);const w=el("button","want",on?t("wanted"):t("want"));w.type="button";w.setAttribute("aria-pressed",String(on));
    w.onclick=()=>{S.want=on?S.want.filter(v=>v!==it.n):[...S.want,it.n];save();render()};body.append(w)}
  const cr=el("p","muted",t("photo")+": "+PH[it.n][1]+" · "+PH[it.n][2]+" · Wikimedia Commons");cr.style.fontSize="12px";body.append(cr);
  const keep=sh.dataset.n===it.n?sh.scrollTop:0;sh.dataset.n=it.n;sh.textContent="";sh.append(ph,body);sh.scrollTop=keep;
}
function renderCredits(){
  const L=$("creditlist");if(L.childElementCount)return;
  Object.keys(PH).forEach(n=>{const a=el("a","credit");a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(PH[n][0].replace(/ /g,"_"));a.target="_blank";a.rel="noopener";
    const d=el("div");d.append(el("b","",n),document.createTextNode(PH[n][1]+" · "+PH[n][2]));a.append(pimg(n,"s"),d);L.append(a)});
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("confetti");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const col=["#FFCD00","#003087","#C8102E","#D91023","#FFFFFF"];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,w:6+Math.random()*6,r:Math.random()*6,c:col[Math.floor(Math.random()*col.length)],s:(Math.random()-.5)*2}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});
    if(now-t0<3200)requestAnimationFrame(f);else c.hidden=true})(t0);
}
const WIN=4;
function newQuiz(){
  const all=[];for(const c of["co","pe"])DATA[c].dishes.forEach(d=>all.push({c,d}));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  S.quiz={q:all.slice(0,6).map(x=>({c:x.c,n:x.d.n})),i:0,score:0,ans:null};
}
function findDish(n){for(const c of["co","pe"]){const d=DATA[c].dishes.find(x=>x.n===n);if(d)return d}}
function renderQuiz(){
  if(!S.quiz)newQuiz();
  const Q=S.quiz,box=$("quizcard");box.textContent="";
  $("rules").textContent=t("rules",{n:WIN,t:Q.q.length});
  if(Q.i>=Q.q.length){
    const won=Q.score>=WIN;
    if(won){
      if(!Q.done){Q.done=1;Q.at=new Date().toLocaleString(S.lang,{dateStyle:"medium",timeStyle:"short"});confetti()}
      const pz=el("div","prize"),inn=el("div","in");pz.setAttribute("role","status");
      inn.append(el("small","",t("win")+(S.name?" "+S.name:"")),el("strong","",t("claim")),el("span","",t("claimHint")),el("em","",t("score",{s:Q.score,t:Q.q.length})+" · "+Q.at));
      pz.append(el("div","stripe"),inn);box.append(pz);
    }else{
      box.append(el("h3","",t("score",{s:Q.score,t:Q.q.length})),el("p","muted",t("lose",{n:WIN})));
    }
    const again=el("button","btn",t("again"));again.onclick=()=>{newQuiz();render()};
    const home=el("button","btn ghost",t("choose"));home.onclick=()=>go("choose");
    const r=el("div","row");r.append(again,home);box.append(r);return}
  const cur=Q.q[Q.i],d=findDish(cur.n);
  box.append(el("p","muted",(Q.i+1)+" / "+Q.q.length));
  const p=el("div","qph");p.style.background=bands(d.c);p.append(pimg(d.n,"l"));box.append(p,el("h3","",d.n));
  const chips=el("div","chips");chips.style.justifyContent="center";d.i.split(" · ").forEach(x=>chips.append(el("span","chip",x)));box.append(chips);
  const fb=el("div","fb");
  if(Q.ans==null){
    const r=el("div","row");
    ["co","pe"].forEach(c=>{const b=el("button","btn ghost",CN[c]);b.onclick=()=>{Q.ans=c;if(c===cur.c)Q.score++;render()};r.append(b)});
    box.append(r,fb);
  }else{
    const ok=Q.ans===cur.c;fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?t("ok"):t("no",{c:CN[cur.c]});
    const nx=el("button","btn",t("next"));nx.onclick=()=>{Q.i++;Q.ans=null;render()};
    box.append(fb,el("p","muted",d.d[S.lang]||d.d.en),nx);
  }
}
function go(s){stopSpeak();S.rec=false;if(s==="credits"&&S.screen!=="credits")S.prev=S.screen;S.open=null;S.screen=s;if(s==="quiz"&&(!S.quiz||S.quiz.i>=S.quiz.q.length))newQuiz();render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const c=e.target.closest("[data-country]");if(c){S.country=c.dataset.country;S.tab="dishes";go("country");return}
  const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render()}
});
$("back").onclick=()=>go(S.screen==="credits"?(S.prev||"home"):(BACK[S.screen]||"home"));
$("sheetbg").onclick=e=>{if(e.target.id==="sheetbg")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.open)closeSheet()});
(function(){const st=$("strip"),names=[...DATA.co.dishes,...DATA.pe.dishes].map((d,i,a)=>a[(i%2?6:0)+Math.floor(i/2)].n);
  [...names,...names].forEach(n=>{const i=pimg(n,"s");i.loading="eager";st.append(i)});
  (function(){const i=new Image();i.onload=()=>{$("campus").style.backgroundImage='url("'+i.src+'")'};i.src=purl("Mission College","l")})();
  document.querySelectorAll("img[data-ph]").forEach(i=>{i.onerror=()=>i.remove();i.src=purl(i.dataset.ph,"l")})})();
$("langbtn").onclick=()=>{stopSpeak();const i=LANGS.findIndex(l=>l[0]===S.lang);S.lang=LANGS[(i+1)%LANGS.length][0];save();render()};
$("regform").addEventListener("submit",e=>{e.preventDefault();const n=$("name").value.trim();
  if(!n){$("regerr").textContent=t("needName");$("name").focus();return}
  $("regerr").textContent="";S.name=n;S.from=$("from").value.trim();save();go("lang")});

function start(d){load();if(d&&d.screen)Object.assign(S,d);$("name").value=S.name||"";$("from").value=S.from||"";render()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
